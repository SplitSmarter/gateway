name: Trigger Gateway Deployment

# Manual only — does not run on push.
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch to build and deploy
        required: true
        type: choice
        options:
          - dev
          - develop
          - qa
          - test
          - main
          - release
        default: dev

permissions:
  contents: read
  packages: write

jobs:
  call-central-workflow:
    uses: SplitSmarter/ci-cd-workflows/.github/workflows/java-docker-deploy.yml@main
    with:
      branch_name: ${{ format('refs/heads/{0}', inputs.git_ref) }}
      git_ref: ${{ inputs.git_ref }}
      service_name: gateway
      project_root: "."
    secrets:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
